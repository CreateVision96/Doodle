<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Doodle</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <main class="container">
      <button class="menuBtn" id="menuBtn" title="Menu">
        <img src="icons/menu.svg" />
      </button>

      <div class="menuPanel" id="menuPanel">
        <div class="menuHeader">Doodle</div>

        <button class="menuItem" id="newCanvas">
          <span>New Canvas</span>
        </button>

        <button class="menuItem" id="exportBtn">
          <span>Export PNG</span>
        </button>

        <div class="menuDiv"></div>
        <button class="menuItem" id="clearBtn">
          <span>Clear Canvas</span>
        </button>
        <div class="menuDiv"></div>
        <button class="menuItem" id="shortcutsBtn">
          <span>Keyboard shortcuts</span>
        </button>
        <button class="menuItem" id="abtBtn">
          <span>About</span>
        </button>
      </div>

      <canvas id="canvas"></canvas>
      <aside class="toolbar">
        <div class="toolGroup">
          <button class="tool" id="drawTool" title="Draw">
            <img src="icons/draw.svg" alt="Draw" />
          </button>

          <button class="tool" id="eraserTool" title="Eraser">
            <img src="icons/eraser.svg" alt="Eraser" />
          </button>

          <button class="tool" id="lineTool" title="Line">
            <img src="icons/line.svg" alt="Line" />
          </button>

          <button class="tool" id="rectangleTool" title="Rectangle">
            <img src="icons/square.svg" alt="Rectangle" />
          </button>

          <button class="tool" id="circleTool" title="Circle">
            <img src="icons/circle.svg" alt="Circle" />
          </button>

          <button class="tool" id="arrowTool" title="Arrow">
            <img src="icons/arrow.svg" alt="Arrow" />
          </button>
        </div>

        <div class="historyTools">
          <button class="tool" id="undoBtn" title="Undo">
            <img src="icons/undo.svg" alt="Undo" />
          </button>
        </div>

        <div class="toolGroup redoGroup">
          <button class="tool" id="redoBtn" title="Redo">
            <img src="icons/redo.svg" alt="Redo" />
          </button>
        </div>
      </aside>
      <div class="stylePanel">
        <div class="setting ClrSetting">
          <span class="settingClr">Color</span>

          <button class="ClrButton" id="ClrButton"></button>
        </div>

        <div class="ClrPanel" id="ClrPanel">
          <div class="ClrPanelTitle">Stroke</div>
          <div class="ClrPanelLabel">Colors</div>
          <div class="ClrGrid" id="ClrGrid"></div>
          <div class="ClrPanelLabel">Shades</div>
          <div class="shadeRow" id="shadeRow"></div>
          <div class="ClrPanelLabel">Hex code</div>
          <div class="hexRow">
            <span class="hexHash">#</span>

            <input
              type="text"
              class="hexInput"
              id="hexInput"
              maxlength="6"
              value="111111"
              spellcheck="false"
            />

            <button class="eyedropButton" id="eyedropButton">
              <img src="icons/pipette.svg" />
            </button>
          </div>
        </div>
        <div class="setting">
          <span class="settingTitle">Stroke width</span>
          <input
            type="range"
            class="widthSlider"
            id="widthSlider"
            min="1"
            max="50"
            value="10"
          />
          <div class="sliderValues">
            <span id="widthValue">2 px</span>
          </div>
        </div>

        <div class="setting opacitySetting">
          <span class="settingTitle">Opacity</span>
          <input
            type="range"
            class="opacitySlider"
            id="opacitySlider"
            min="0"
            max="100"
            value="100"
          />
          <div class="sliderValues">
            <span id="opacityValue">100%</span>
          </div>
        </div>
      </div>

      <div class="minimap" id="minimap">
        <canvas id="minican"></canvas>
      </div>

      <div class="btm">
        <button class="pressureBtn" id="pressTgl" title="Pressure">
          <img src="icons/line-squiggle.svg" />
        </button>

        <div class="zoomControls">
          <button class="zoomButton" id="zoomOut">-</button>
          <span class="zoomValue" id="zoomValue">100%</span>
          <button class="zoomButton" id="zoomIn">+</button>
        </div>
      </div>
    </main>
    <script src="script.js"></script>
  </body>
</html>
